name: Build APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend API URL"
        required: false
        default: "https://YOUR-DOMAIN.example.com"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PAPI_URL="${{ inputs.api_url }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SiamNetworkMap-debug-apk
          path: app/build/outputs/apk/debug/*.apkapk
